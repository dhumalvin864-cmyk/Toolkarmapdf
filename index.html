/* =========================================
   PRELOADER ANIMATION STYLES (ENHANCED)
   ========================================= */
#preloader {
  position: fixed;
  inset: 0;
  background: #0E1B3D;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s cubic-bezier(0.77, 0, 0.175, 1), visibility 0.8s ease;
}
#preloader.fade-out { opacity: 0; visibility: hidden; }

.loader-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid transparent;
  animation: spinRing 3s linear infinite;
}
.ring-1 { width: 350px; height: 350px; border-top-color: #FF9933; border-bottom-color: #138808; animation-duration: 4s; }
.ring-2 { width: 300px; height: 300px; border-left-color: #FF9933; border-right-color: #138808; animation-duration: 3s; animation-direction: reverse; }

.loader-content {
  position: relative;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(2.5rem, 8vw, 5rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
  background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  animation: liquidFill 3s ease-in-out infinite alternate, scaleUp 1.5s ease-out forwards;
  z-index: 10;
}
.loader-content::after {
  content: 'ilovetoolkarma';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  color: #fff; -webkit-text-stroke: 0;
  clip-path: inset(100% 0 0 0);
  animation: fillUp 2.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
}
.flag-bar {
  width: 180px; height: 6px; margin-top: 25px; border-radius: 4px;
  background: linear-gradient(to bottom, #FF9933 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #138808 66.66%);
  box-shadow: 0 0 20px rgba(255, 153, 51, 0.6);
  animation: pulseGlow 1.5s ease-in-out infinite alternate;
}
@keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes scaleUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes fillUp { 0% { clip-path: inset(100% 0 0 0); } 100% { clip-path: inset(0 0 0 0); } }
@keyframes liquidFill { 0% { background-position: 0% center; } 100% { background-position: 100% center; } }
@keyframes pulseGlow { 0% { filter: drop-shadow(0 0 5px rgba(255, 153, 51, 0.3)); opacity: 0.8; } 100% { filter: drop-shadow(0 0 25px rgba(19, 136, 8, 0.8)); opacity: 1; } }

/* =========================================
   PREMIUM ANIMATED ICONS & HOVER EFFECTS
   ========================================= */
.fade-in-page { animation: fadeInPage 0.8s ease-out forwards; }
@keyframes fadeInPage { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.tile { position: relative; overflow: hidden; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease; }
.tile:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px -15px var(--c); border-color: var(--c); }
.tile::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: left 0.5s ease; pointer-events: none; }
.tile:hover::before { left: 100%; }

.ic { flex:none; width:46px; height:46px; border-radius:12px; display:grid; place-items:center; font-size:22px; background:var(--c); color:#fff; transition: all 0.4s ease; background:linear-gradient(145deg, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 80%,#000)); box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2), 0 6px 15px -4px var(--c); position: relative; z-index: 2; }
.tile:hover .ic { transform: rotate(-8deg) scale(1.1); box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), inset 0 -2px 0 rgba(0,0,0,0.1), 0 10px 25px -5px var(--c); }
.ic svg { width: 26px; height: 26px; stroke-width: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); transition: all 0.3s ease; }

.tile[data-k="rotate"]:hover .ic svg { animation: spin 2s linear infinite; }
.tile[data-k="merge"]:hover .ic svg path:nth-child(2) { animation: mergeFloat 1.5s ease-in-out infinite alternate; }
.tile[data-k="split"]:hover .ic svg path:nth-child(3) { animation: pulseLine 1s ease-in-out infinite alternate; }
.tile[data-k="scan"]:hover .ic svg circle { animation: scanPulse 1.5s ease-in-out infinite alternate; }
.tile[data-k="summarize"]:hover .ic svg path:last-child { animation: sparkle 1.2s ease-in-out infinite alternate; }
.tile[data-k="ocr"]:hover .ic svg path:last-child { animation: typing 1s steps(2, end) infinite; }
.tile[data-k="compress"]:hover .ic svg path:nth-child(2) { animation: compressIn 1s ease-in-out infinite alternate; }

@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes mergeFloat { 0% { transform: translate(0, 0); } 100% { transform: translate(-2px, -2px); } }
@keyframes pulseLine { 0% { stroke-dasharray: 2.5 2.5; } 100% { stroke-dasharray: 5 5; } }
@keyframes scanPulse { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
@keyframes sparkle { 0% { opacity: 0.3; transform: scale(0.8) rotate(0deg); } 100% { opacity: 1; transform: scale(1.2) rotate(15deg); } }
@keyframes typing { 0% { stroke-dasharray: 0 100; } 50% { stroke-dasharray: 50 100; } 100% { stroke-dasharray: 100 100; } }
@keyframes compressIn { 0% { transform: translate(0,0); } 100% { transform: translate(-1px, 1px); } }

/* =========================================
   PREMIUM LANGUAGE DROPDOWN
   ========================================= */
.lang-dropdown { position: relative; }
.lang-toggle { 
  display: flex; align-items: center; justify-content: center;

/* =========================================

.ft {

  margin: 3px 0;
  background: transparent;
  border: 1px solid transparent;

/* =========================================
   PREMIUM MOTION & BRAND POLISH
   ========================================= */
#preloader {
  overflow: hidden;
  isolation: isolate;

const {PDFDocument,degrees,StandardFonts,rgb}=PDFLib;

function ranges(s,n){
  const out=[];
  s.split(',').map(x=>x.trim()).filter(Boolean).forEach(p=>{
    const m=p.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if(!m)throw new Error('Couldn’t read “'+p+'”. Use a format like 1-3, 5, 8-10.');
    let a=+m[1],b=m[2]?+m[2]:a;
    if(a>b)[a,b]=[b,a];
    if(a<1||b>n)throw new Error('This PDF has '+n+' pages. Pick pages between 1 and '+n+'.');
    for(let i=a;i<=b;i++)if(!out.includes(i-1))out.push(i-1);
  });
  if(!out.length)throw new Error('Enter the pages you want, for example 1-3, 5.');
  return out;
}
const load=async f=>PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
const pdfAccept='.pdf,application/pdf';

const TOOLS={
 merge:{n:'Merge PDF',d:'Combine several PDFs into one, in the order you choose.',g:'⧉',c:'#E5484D',acc:pdfAccept,multi:true,min:2,order:true,out:'merged.pdf',
  run:async fs=>{const o=await PDFDocument.create();for(const f of fs){const s=await load(f);(await o.copyPages(s,s.getPageIndices())).forEach(p=>o.addPage(p));}return o.save();}},
 split:{n:'Extract pages',d:'Pull out the pages you need into a new PDF.',g:'✂',c:'#E8890C',acc:pdfAccept,min:1,out:'extracted.pdf',
  opts:[{id:'r',l:'Pages to keep',ph:'1-3, 5, 8-10'}],

 remove:{n:'Remove pages',d:'Delete pages you don’t want and keep the rest.',g:'⌫',c:'#B83280',acc:pdfAccept,min:1,out:'trimmed.pdf',
  opts:[{id:'r',l:'Pages to remove',ph:'2, 4-6'}],

 rotate:{n:'Rotate PDF',d:'Turn every page the right way up.',g:'↻',c:'#2F6FED',acc:pdfAccept,min:1,out:'rotated.pdf',

 img:{n:'Images to PDF',d:'Turn JPG and PNG images into one PDF.',g:'▣',c:'#0B7A75',acc:'.jpg,.jpeg,.png,image/jpeg,image/png',multi:true,min:1,order:true,out:'images.pdf',
  run:async fs=>{const o=await PDFDocument.create();for(const f of fs){const b=await f.arrayBuffer();const im=/png$/i.test(f.name)||f.type==='image/png'?await o.embedPng(b):await o.embedJpg(b);
    const W=595,H=842,m=24,k=Math.min((W-2*m)/im.width,(H-2*m)/im.height,1);const w=im.width*k,h=im.height*k;
    const p=o.addPage([W,H]);p.drawImage(im,{x:(W-w)/2,y:(H-h)/2,width:w,height:h});}return o.save();}},

async function eachPage(f,scale,fn,max){const d=await jdoc(f);for(let i=1;i<=Math.min(d.numPages,max||1e9);i++){const p=await d.getPage(i);const vp=p.getViewport({scale});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:vp}).promise;await fn(c,i,p.getViewport({scale:1}))}}

 watermark:{n:'Watermark',d:'Stamp diagonal text across every page.',g:'≋',c:'#9C36B5',acc:pdfAccept,min:1,out:'watermarked.pdf',

 repair:{n:'Repair PDF',d:'Rebuild a PDF that opens with errors. Works for minor damage.',g:'✚',c:'#087F5B',acc:pdfAccept,min:1,out:'repaired.pdf',

 oddeven:{n:'Odd or even pages',d:'Keep only the odd or only the even pages.',g:'∷',c:'#E8590C',acc:pdfAccept,min:1,out:'selected-pages.pdf',
  opts:[{id:'o',l:'Keep',ch:[['odd','Odd pages (1, 3, 5…)'],['even','Even pages (2, 4, 6…)']]}],
  run:async(fs,v)=>{const s=await load(fs[0]);const k=s.getPageIndices().filter(i=>(i%2===0)===(v.o==='odd'));if(!k.length)throw new Error('This PDF has no pages of that kind.');const o=await PDFDocument.create();(await o.copyPages(s,k)).forEach(p=>o.addPage(p));return o.save()}},
 blank:{n:'Insert blank page',d:'Add an empty page anywhere in your PDF.',g:'□',c:'#868E96',acc:pdfAccept,min:1,out:'with-blank-page.pdf',
  opts:[{id:'a',l:'Insert after page (0 = at the start)',ph:'1'}],
  run:async(fs,v)=>{const s=await load(fs[0]);const n=s.getPageCount(),k=parseInt(v.a,10);if(isNaN(k)||k<0||k>n)throw new Error('Enter a page number from 0 to '+n+'.');const{width:w,height:h}=s.getPage(Math.max(k-1,0)).getSize();s.insertPage(k,[w,h]);return s.save()}},
 a4:{n:'Resize to A4',d:'Fit every page onto A4 paper, keeping the layout.',g:'▭',c:'#1C7ED6',acc:pdfAccept,min:1,out:'a4.pdf',
  run:async fs=>{const s=await load(fs[0]);const o=await PDFDocument.create();for(const p of s.getPages()){const e=await o.embedPage(p);const[w,h]=e.width>e.height?[841.89,595.28]:[595.28,841.89];const k=Math.min(w/e.width,h/e.height);o.addPage([w,h]).drawPage(e,{x:(w-e.width*k)/2,y:(h-e.height*k)/2,width:e.width*k,height:e.height*k})}return o.save()}},
 meta:{n:'Edit title and author',d:'Change the title and author stored inside the PDF.',g:'ⓘ',c:'#2F9E44',acc:pdfAccept,min:1,out:'updated.pdf',
  opts:[{id:'t',l:'Title',ph:'Leave blank to keep as is'},{id:'a',l:'Author',ph:'Leave blank to keep as is'}],
  run:async(fs,v)=>{if(!(v.t||'').trim()&&!(v.a||'').trim())throw new Error('Type a new title or author.');const s=await load(fs[0]);if(v.t.trim())s.setTitle(v.t.trim());if(v.a.trim())s.setAuthor(v.a.trim());return s.save()}},
 flatten:{n:'Flatten PDF',d:'Lock form fields and notes into the page. Text becomes an image.',g:'▬',c:'#C92A2A',acc:pdfAccept,min:1,out:'flattened.pdf',
  run:fs=>raster(fs[0],2,.92,false)},
 redact:{n:'Redact text',d:'Black out a word or phrase for good. Pages become images, so the text is truly gone.',g:'■',c:'#212529',acc:pdfAccept,min:1,out:'redacted.pdf',
  opts:[{id:'t',l:'Word or phrase to black out',ph:'e.g. a name or number'}],
  run:async(fs,v)=>{const t=(v.t||'').trim().toLowerCase();if(!t)throw new Error('Type the word or phrase to black out.');const d=await jdoc(fs[0]);const o=await PDFDocument.create();let hits=0;
   for(let i=1;i<=d.numPages;i++){const p=await d.getPage(i);const vp=p.getViewport({scale:1.6}),v1=p.getViewport({scale:1});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:x,viewport:vp}).promise;x.fillStyle='#000';
    (await p.getTextContent()).items.forEach(s=>{if(!s.str.toLowerCase().includes(t))return;hits++;const m=pdfjsLib.Util.transform(vp.transform,s.transform),h=Math.hypot(m[2],m[3]);x.fillRect(m[4]-2,m[5]-h*.95,s.width*vp.scale+4,h*1.25)});
    const im=await o.embedJpg(await(await jpg(c,.9)).arrayBuffer());o.addPage([v1.width,v1.height]).drawImage(im,{x:0,y:0,width:v1.width,height:v1.height})}
   if(!hits)throw new Error('That text wasn’t found. Scanned PDFs can’t be searched.');return o.save()}},
 compare:{n:'Compare PDFs',d:'Pick two PDFs and get a page-by-page list of text differences.',g:'⇄',c:'#0CA678',acc:pdfAccept,multi:true,min:2,out:'comparison.txt',
  run:async fs=>{if(fs.length!==2)throw new Error('Choose exactly two PDFs.');const a=await pageText(fs[0]),b=await pageText(fs[1]);const n=Math.max(a.length,b.length);let o='A: '+fs[0].name+' ('+a.length+' pages)\nB: '+fs[1].name+' ('+b.length+' pages)\n\n',d=0;
   for(let i=0;i<n;i++){if(a[i]===b[i])continue;d++;if(a[i]===undefined){o+='Page '+(i+1)+': only in B\n';continue}if(b[i]===undefined){o+='Page '+(i+1)+': only in A\n';continue}
    const wa=a[i].split(' '),wb=b[i].split(' '),sa=new Set(wa),sb=new Set(wb);o+='Page '+(i+1)+' differs\n  Only in A: '+([...new Set(wa.filter(w=>!sb.has(w)))].slice(0,40).join(' ')||'(nothing)')+'\n  Only in B: '+([...new Set(wb.filter(w=>!sa.has(w)))].slice(0,40).join(' ')||'(nothing)')+'\n'}
   return o+(d?'\n'+d+' page(s) differ.':'No text differences found.')+'\nThis compares text only, not images or layout.\n'}},
 summarize:{n:'Summarize PDF',d:'Extract the most important sentences from the document using AI-like text analysis.',g:'✨',c:'#8E5BD6',acc:pdfAccept,min:1,out:'summary.txt',
  run:async fs=>{
    const pages=await pageText(fs[0]);
    let text=pages.join(' ');
    if(!text.trim()) throw new Error('No text found to summarize. Use OCR first for scanned PDFs.');
    const sentences=text.match(/[^.!?]+[.!?]+/g) || [text];
    const words=text.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
    const freq={};
    words.forEach(w=>freq[w]=(freq[w]||0)+1);
    const ranked=sentences.map(s=>{
      const sWords=s.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
      let score=0;
      sWords.forEach(w=>{ if(freq[w]) score+=freq[w]; });
      return { text: s.trim(), score: score/(sWords.length||1) };
    });
    ranked.sort((a,b)=>b.score-a.score);
    const topSentences=ranked.slice(0, Math.min(15, ranked.length)).map(r=>r.text);
    const summary=topSentences.map(s=>'- '+s).join('\n\n');
    return '--- PDF SUMMARY ---\n\n'+summary+'\n\n(Generated via frequency analysis)';
  }},
 ocr:{n:'OCR PDF (Scan to Text)',d:'Extract text from scanned PDF pages using Optical Character Recognition (English).',g:'🔍',c:'#D6336C',acc:pdfAccept,min:1,out:'ocr_text.txt',
  run:async fs=>{
    if(typeof Tesseract === 'undefined') throw new Error('OCR Library not loaded. Please check your internet connection.');
    const d=await jdoc(fs[0]);
    let finalText='';
    const worker = await Tesseract.createWorker('eng');
    for(let i=1; i<=d.numPages; i++){
      const p=await d.getPage(i);
      const vp=p.getViewport({scale:2});
      const c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;
      const x=c.getContext('2d');
      x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      await p.render({canvasContext:x,viewport:vp}).promise;
      const { data: { text } } = await worker.recognize(c);
      finalText += '--- Page '+i+' ---\n'+text+'\n\n';
    }
    await worker.terminate();
    if(!finalText.trim()) throw new Error('No text recognized. The scan quality might be too low.');
    return finalText;
  }}

   const aoa=Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a[0]-b[0]).map(c=>c[1]));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa.length?aoa:[['']]),'Page '+i)}return new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'}))}},
 pdf2ppt:{n:'PDF to PowerPoint',d:'Turn every PDF page into a slide, as a picture.',acc:pdfAccept,min:1,out:'slides.pptx',
  run:async fs=>{need(window.PptxGenJS,'The PowerPoint maker');const px=new PptxGenJS();let first=true;await eachPage(fs[0],1.6,async(c,i,v)=>{if(first){px.defineLayout({name:'PDF',width:v.width/72,height:v.height/72});px.layout='PDF';first=false}px.addSlide().addImage({data:c.toDataURL('image/jpeg',.85),x:0,y:0,w:v.width/72,h:v.height/72})});return px.write({outputType:'uint8array'})}},
 pdf2md:{n:'PDF to Markdown',d:'Save the text as a .md file, with headings found from font size.',acc:pdfAccept,min:1,out:'converted.md',
  run:async fs=>{const pg=await pdfLines(fs[0]);const hs=pg.flat().map(l=>l.h).filter(Boolean).sort((a,b)=>a-b);const med=hs[hs.length>>1]||10;let o='';pg.forEach((ls,i)=>{ls.forEach(l=>{o+=(l.h>med*1.5?'# ':l.h>med*1.2?'## ':'')+l.t+'\n\n'});if(i<pg.length-1)o+='---\n\n'});if(!o.trim())throw new Error('No text found. Try OCR for scanned PDFs.');return o}},

});

const msg=(t,c)=>{$('msg').textContent=t||'';$('msg').className='msg '+(c||'')};
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

function open(k){
  cur=TOOLS[k];curK=k;files=[];result=null;markSB();
  $('home').hidden=true;$('info').hidden=true;$('work').hidden=false;
  $('wt').textContent=nm(k,0);$('wd').textContent=nm(k,1);
  $('fi').accept=cur.acc;$('fi').multiple=!!cur.multi;$('fi').value='';cur.cap?$('fi').setAttribute('capture','environment'):$('fi').removeAttribute('capture');
  $('dzt').textContent=T(cur.multi?'c1':'c0');
  const op=$('op');op.innerHTML='';
  (cur.opts||[]).forEach(o=>{
    const l=document.createElement('label');l.textContent=o.l;
    let e;
    if(o.ch){e=document.createElement('select');o.ch.forEach(([v,t])=>{const x=document.createElement('option');x.value=v;x.textContent=t;e.appendChild(x)});}
    else{e=document.createElement('input');e.type=o.pw?'password':'text';e.placeholder=o.ph||'';e.autocomplete='off';}
    e.dataset.id=o.id;e.oninput=e.onchange=()=>{result=null;$('save').hidden=true};l.appendChild(e);op.appendChild(l);
  });
  $('run').textContent=nm(k,0);msg('');draw();window.scrollTo(0,0);
}
function home(){$('work').hidden=true;$('info').hidden=true;$('home').hidden=false;cur=null;curI=null;curK=null;markSB();window.scrollTo(0,0)}
$('back').onclick=$('logo').onclick=home;

function add(list){
  const ok=[...list].filter(f=>cur.acc.split(',').some(a=>a.startsWith('.')?f.name.toLowerCase().endsWith(a):f.type===a));
  if(ok.length<list.length)msg('Some files were skipped because they aren’t the right type.','err');else msg('');
  files=cur.multi?files.concat(ok):ok.slice(0,1);result=null;$('save').hidden=true;draw();
}
function draw(){
  const ul=$('fl');ul.innerHTML='';
  files.forEach((f,i)=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="fn"></span><span class="sz">'+fmt(f.size)+'</span>';
    li.firstChild.textContent=f.name;
    const mk=(t,l,fn,dis)=>{const b=document.createElement('button');b.className='mini';b.textContent=t;b.setAttribute('aria-label',l+' '+f.name);b.disabled=dis;b.onclick=fn;li.appendChild(b)};
    if(cur.order){mk('↑','Move up',()=>swap(i,i-1),i===0);mk('↓','Move down',()=>swap(i,i+1),i===files.length-1)}
    mk('✕','Remove',()=>{files.splice(i,1);result=null;$('save').hidden=true;draw()});
    ul.appendChild(li);
  });
  $('run').disabled=files.length<cur.min;
  $('dzs').textContent=T(files.length?(cur.multi?'more':'pick'):'dr');
}
function swap(a,b){[files[a],files[b]]=[files[b],files[a]];result=null;$('save').hidden=true;draw()}

$('fi').onchange=e=>{add(e.target.files);e.target.value=''};
const dz=$('dz');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)add(e.dataTransfer.files)});

$('run').onclick=async()=>{
  const v={};$('op').querySelectorAll('[data-id]').forEach(e=>v[e.dataset.id]=e.value);
  $('run').disabled=true;$('run').classList.add('busy');$('save').hidden=true;msg(T('work'));
  try{
    const bytes=await cur.run(files,v);
    result={bytes,name:cur.out};$('run').classList.remove('busy');
    msg(T('done')+' ('+fmt(bytes.length)+').','ok');$('save').hidden=false;
  }catch(e){$('run').classList.remove('busy');msg(e.message&&!/^Failed to parse|No PDF header/.test(e.message)?e.message:'We couldn’t open one of the files. It may be damaged or password-protected.','err')}
  $('run').disabled=files.length<cur.min;
};
$('save').onclick=()=>{
  if(!result)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result.bytes]));a.download=result.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  msg(T('saved'),'ok');
};

  faq:'क्या यह मुफ़्त है?\nहाँ। साइन-अप नहीं है और आपकी फ़ाइलों में कुछ जोड़ा नहीं जाता।\n\nक्या मेरी फ़ाइलें अपलोड होती हैं?\nनहीं। सब कुछ ब्राउज़र में चलता है, इसलिए फ़ाइलें आपके डिवाइस पर ही रहती हैं।\n\nमेरा टेक्स्ट इमेज क्यों बन गया?\nCompress, Grayscale, Flatten, Unlock और Redact हर पेज को इमेज की तरह दोबारा बनाते हैं। इसलिए बाद में टेक्स्ट चुना नहीं जा सकता।\n\nPDF पर पासवर्ड क्यों नहीं लगा सकते?\nयहाँ इस्तेमाल हो रहे ब्राउज़र टूल से असली PDF एन्क्रिप्शन संभव नहीं है, इसलिए हम नकली विकल्प नहीं देते।',
  about:'ilovetoolkarmapdf में आपका स्वागत है! 🚀\n\nहम एक समर्पित टीम हैं जो आपके दस्तावेज़ों को संभालना आसान बनाने के लिए काम कर रही है। हमारा मिशन आपको शक्तिशाली और सुपरफास्ट PDF टूल्स देना है जो सबसे पहले आपकी गोपनीयता (Privacy) का ख्याल रखें।\n\nअन्य वेबसाइटों की तरह, हम आपकी फ़ाइलें किसी सर्वर पर अपलोड नहीं करते। इस साइट के सभी टूल आपके ब्राउज़र के अंदर ही चलते हैं, जिसका मतलब है कि आपका कीमती डेटा आपके डिवाइस पर ही सुरक्षित रहता है।\n\nचाहे आप छात्र हों, पेशेवर हों, या कोई फ़ाइल कंप्रेस करना चाहते हों, यह टूलकिट आपके लिए ही बनाया गया है। यह 100% मुफ़्त है, इसमें साइन-अप की ज़रूरत नहीं है और यह अंग्रेज़ी, मराठी और हिन्दी में काम करता है।\n\nहम पर भरोसा करने के लिए धन्यवाद!',
  priv:'कोई अकाउंट नहीं है और हम आपकी फ़ाइलें इकट्ठा नहीं करते। सब कुछ पूरी तरह ब्राउज़र में चलता है। सिर्फ़ आपकी भाषा की पसंद आपके अपने ब्राउज़र में सेव होती है।',
  terms:'ये टूल "जैसे हैं वैसे" बिना किसी गारंटी के दिए गए हैं। नतीजे पर भरोसा करने से पहले उसे जाँचें और मूल फ़ाइल की कॉपी रखें। जो फ़ाइलें आप इस्तेमाल करते हैं उनका अधिकार आपके पास होना आपकी ज़िम्मेदारी है।',
  cook:'हम कुकीज़ या ट्रैकर इस्तेमाल नहीं करते। पेज सिर्फ़ आपकी भाषा की पसंद आपके ब्राउज़र के लोकल स्टोरेज में रखता है, जो आपके डिवाइस से बाहर नहीं जाता।'}
};
function showInfo(k,keep){curI=k;cur=null;curK=null;markSB();$('home').hidden=true;$('work').hidden=true;$('info').hidden=false;$('it').textContent=T(k);$('ib').textContent=(INFO[lang]||INFO.en)[k];if(!keep)window.scrollTo(0,0)}
$('iback').onclick=home;
$('fl2').onchange=e=>setLang(e.target.value);
document.querySelectorAll('.ft [data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='home'||g==='tools'){home();if(g==='tools')$('grid').scrollIntoView({behavior:'smooth'})}else showInfo(g)});
document.querySelectorAll('.lang-menu button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let l0='';try{l0=localStorage.getItem('lang')||''}catch(e){}
if(!UI[l0]){const n=(navigator.language||'en').slice(0,2);l0=UI[n]?n:'en'}
Object.assign(UI.en,{hq:'Search all PDF tools (e.g. merge, compress, JPG)',nores:'No tools found. Try another word.'});
Object.assign(UI.mr,{hq:'सर्व PDF टूल्स शोधा (उदा. merge, compress, JPG)',nores:'कोणतेही टूल सापडले नाही. दुसरा शब्द वापरून पहा.'});
Object.assign(UI.hi,{hq:'सभी PDF टूल खोजें (जैसे merge, compress, JPG)',nores:'कोई टूल नहीं मिला। कोई दूसरा शब्द आज़माएँ।'});
function filterAll(raw){const q=raw.trim().toLowerCase();const m=k=>!q||(nm(k,0)+' '+nm(k,1)+' '+TOOLS[k].n+' '+TOOLS[k].d).toLowerCase().includes(q);
 document.querySelectorAll('.sbi').forEach(b=>b.hidden=!m(b.dataset.k));
 document.querySelectorAll('.sbc').forEach(d=>{d.hidden=!d.querySelector('.sbi:not([hidden])');if(q)d.open=true});
 let n=0;document.querySelectorAll('.tile').forEach(b=>{const s=m(b.dataset.k);b.hidden=!s;if(s)n++});
 document.querySelectorAll('.cat').forEach(h=>{const g=h.nextElementSibling;h.hidden=g.hidden=!g.querySelector('.tile:not([hidden])')});
 $('nores').hidden=n>0}
$('hq').oninput=$('sbq').oninput=e=>{$('hq').value=$('sbq').value=e.target.value;filterAll(e.target.value)};
$('hq').onkeydown=e=>{if(e.key==='Escape'){$('hq').value=$('sbq').value='';filterAll('')}if(e.key==='Enter'){const v=[...document.querySelectorAll('.tile:not([hidden])')];if(v.length===1)open(v[0].dataset.k)}};
setLang(l0);
</script>
